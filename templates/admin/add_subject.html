{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="custom-card shadow-sm border-top" style="border-width: 4px !important; border-color: #0dcaf0 !important;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="fa-solid fa-book text-info me-2"></i> Fan Yaratish</h4>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-light shadow-sm"><i class="fa-solid fa-arrow-left"></i> Orqaga</a>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Fan nomi</label>
                    <input type="text" name="name" class="form-control" placeholder="Misol: Oliy Matematika" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Fanga o'qituvchi biriktirish</label>
                    <select name="teacher" class="form-control" required>
                        <option value="">O'qituvchini tanlang</option>
                        {% for teacher in teachers %}
                            <option value="{{ teacher.id }}">{{ teacher.first_name }} ({{ teacher.username }})</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-info w-100 text-white fw-bold"><i class="fa-solid fa-plus me-2"></i> Yaratish</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
