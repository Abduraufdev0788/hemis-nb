{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="custom-card shadow-sm border-top" style="border-width: 4px !important; border-color: #f59e0b !important;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="fa-solid fa-layer-group text-warning me-2"></i> Guruh Yaratish</h4>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-light shadow-sm"><i class="fa-solid fa-arrow-left"></i> Orqaga</a>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Guruh nomi (Shifri)</label>
                    <input type="text" name="name" class="form-control" placeholder="Misol: KI-21-01" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 text-white fw-bold"><i class="fa-solid fa-plus me-2"></i> Yaratish</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
