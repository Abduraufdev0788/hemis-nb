{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="custom-card shadow-sm border-top" style="border-width: 4px !important; border-color: #4318FF !important;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="fa-solid fa-chalkboard-user text-primary me-2"></i> O'qituvchi Qo'shish</h4>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-light shadow-sm"><i class="fa-solid fa-arrow-left"></i> Orqaga</a>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Login (Tizimga kirish uchun)</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Parol</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">To'liq ism (F.I.O)</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Telefon raqam</label>
                    <input type="text" name="phone" class="form-control" placeholder="+998...">
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 text-white"><i class="fa-solid fa-save me-2"></i> Saqlash</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
